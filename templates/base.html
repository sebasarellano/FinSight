
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101310">

    <title>{% block title %}FinSight{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a href="{{ url_for('home') }}" class="brand">
                <span class="brand-mark">F</span>
                <span class="brand-name">FinSight<span class="brand-period">.</span></span>
            </a>

            <div class="sidebar-label">GENERAL</div>

            <nav class="navigation" aria-label="Navegación principal">
                <a href="{{ url_for('home') }}" class="nav-link active">
                    <span class="nav-icon">▦</span>
                    <span>Resumen</span>
                </a>

                <a href="#" class="nav-link" aria-disabled="true">
                    <span class="nav-icon">↔</span>
                    <span>Movimientos</span>
                    <span class="nav-soon">Pronto</span>
                </a>

                <a href="#" class="nav-link" aria-disabled="true">
                    <span class="nav-icon">◫</span>
                    <span>Presupuestos</span>
                    <span class="nav-soon">Pronto</span>
                </a>

                <a href="#" class="nav-link" aria-disabled="true">
                    <span class="nav-icon">▤</span>
                    <span>Cuentas</span>
                    <span class="nav-soon">Pronto</span>
                </a>
            </nav>

            <div class="sidebar-bottom">
                <div class="sidebar-note">
                    <span class="status-dot"></span>
                    <span>Entorno local</span>
                </div>
                <p class="sidebar-version">FINSIGHT · VERSIÓN INICIAL</p>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="breadcrumb">
                    <span>FinSight</span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-current">Resumen</span>
                </div>

                <div class="topbar-right">
                    <span class="demo-badge">
                        <span class="status-dot"></span>
                        Modo demostración
                    </span>
                    <div class="avatar" aria-label="Perfil local">S</div>
                </div>
            </header>

            {% block content %}{% endblock %}

            <footer class="page-footer">
                <span>FinSight <span class="footer-dot">·</span> Finanzas con perspectiva.</span>
                <span>Los datos actuales son de demostración.</span>
            </footer>
        </main>
    </div>
</body>
</html>
